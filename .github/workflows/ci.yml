# AIRLOCK CI.
#
# The point of this workflow is not "the tests pass". It is that the four
# claims AIRLOCK makes on its front page are checked mechanically on every
# push, so none of them can quietly stop being true:
#
#   1. no non-PROVEN certificate can open the gate      -> the test suite
#   2. a sealed ledger record cannot be edited unnoticed -> the test suite
#   3. every fixture really is refused for the reason    -> check:fixtures
#      its filename claims
#   4. no agent can write to production without holding  -> check:agents
#      the approval tool
#
# The generated-artefact step is the fifth: docs/CAPABILITIES.md,
# docs/POLICY.md and contracts/dossier.schema.json are emitted from the code,
# so a drift between what we claim and what we do fails the build rather than
# surviving until a judge notices it.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22.14'
          cache: npm

      - name: Install
        run: npm ci

      # The compile-time half of the gate proof lives here: gate.typetest.ts
      # asserts that six ways of forging an ApprovalGrant are type errors. If
      # anyone weakens the type, tsc reports an unused @ts-expect-error and
      # this step fails.
      - name: Build the contract (this is also the compile-time gate proof)
        run: npm run build --workspace @airlock/contract

      - name: SQLite verifier proves the Day 1 migration
        run: |
          AIRLOCK_SEED_ROWS=1000 npm run seed:sqlite -- --reset

          # The benchmark tasks name real tables, columns and indexes. When one
          # drifts it does not fail loudly — the SQL errors, the scorer reads it
          # as a model mistake, and the next quoted number is inflated. Assert
          # the tasks still match the schema they run against.
          npm run check:benchmark
          AIRLOCK_DOSSIER_ID=ci_sqlite_tier node scripts/verify-sqlite-migration.mjs --emit-only > /tmp/airlock-ci-dossier.json
          node --input-type=module <<'NODE'
          import { openGate } from './packages/contract/dist/index.js';
          import { readFileSync } from 'node:fs';

          const dossier = JSON.parse(readFileSync('.airlock/ci_sqlite_tier.dossier.json', 'utf8'));
          if (dossier.certificate?.status !== 'PROVEN') {
            throw new Error(`expected PROVEN certificate, got ${dossier.certificate?.status ?? 'missing'}`);
          }
          if (dossier.certificate.checksums?.match !== true) {
            throw new Error('expected checksum triple to match after rollback');
          }
          const report = JSON.parse(readFileSync('.airlock/ci_sqlite_tier.verification.json', 'utf8'));
          if (!report.ddl_findings?.some((finding) => finding.kind === 'DROP_COLUMN')) {
            throw new Error('expected destructive DDL classifier to flag the plan_name column drop');
          }
          if (!report.expand_contract_plan?.length) {
            throw new Error('expected expand/contract alternative to be generated for the column drop');
          }

          const gate = openGate(dossier, { email: 'ci-approver@airlock.dev', role: 'approver' });
          if (gate.state !== 'OPEN') {
            throw new Error(`expected gate to open, got ${gate.reason}`);
          }
          NODE

          AIRLOCK_DOSSIER_ID=ci_sqlite_bad_rollback node scripts/verify-sqlite-migration.mjs --emit-only --break-rollback > /tmp/airlock-ci-bad-rollback-dossier.json
          node --input-type=module <<'NODE'
          import { openGate } from './packages/contract/dist/index.js';
          import { readFileSync } from 'node:fs';

          const dossier = JSON.parse(readFileSync('.airlock/ci_sqlite_bad_rollback.dossier.json', 'utf8'));
          if (dossier.certificate?.status !== 'FAILED') {
            throw new Error(`expected FAILED certificate, got ${dossier.certificate?.status ?? 'missing'}`);
          }
          if (!dossier.certificate.failure_reason?.includes('post-rollback checksum')) {
            throw new Error(`expected a precise rollback failure reason, got ${dossier.certificate.failure_reason}`);
          }
          if (dossier.certificate.checksums.pre === dossier.certificate.checksums.post_rollback) {
            throw new Error('expected bad rollback to produce a checksum mismatch');
          }
          if (!dossier.rollback.length || !dossier.rollback.every((op) => op.proven)) {
            throw new Error('expected rollback SQL to have executed; this test is about wrong restoration, not missing execution');
          }

          const gate = openGate(dossier, { email: 'ci-approver@airlock.dev', role: 'approver' });
          if (gate.reason !== 'CERTIFICATE_FAILED') {
            throw new Error(`expected gate to seal as CERTIFICATE_FAILED, got ${gate.reason}`);
          }
          NODE

          AIRLOCK_DOSSIER_ID=ci_sqlite_drift node scripts/verify-sqlite-migration.mjs --emit-only --simulate-drift > /tmp/airlock-ci-drift-dossier.json
          node --input-type=module <<'NODE'
          import { openGate } from './packages/contract/dist/index.js';
          import { readFileSync } from 'node:fs';

          const dossier = JSON.parse(readFileSync('.airlock/ci_sqlite_drift.dossier.json', 'utf8'));
          if (dossier.certificate?.status !== 'PROVEN') {
            throw new Error(`expected rollback proof to remain PROVEN, got ${dossier.certificate?.status ?? 'missing'}`);
          }
          if (dossier.certificate.checksums?.match !== true) {
            throw new Error('expected checksum triple to remain matched; this scenario is production drift, not proof failure');
          }
          if (dossier.drift?.drifted !== true) {
            throw new Error('expected production drift re-check to mark the dossier drifted');
          }

          const gate = openGate(dossier, { email: 'ci-approver@airlock.dev', role: 'approver' });
          if (gate.reason !== 'PRODUCTION_DRIFTED') {
            throw new Error(`expected gate to seal as PRODUCTION_DRIFTED, got ${gate.reason}`);
          }
          NODE

          AIRLOCK_DOSSIER_ID=ci_sqlite_erasure_scope AIRLOCK_ERASURE_USER_ID=17 node scripts/verify-sqlite-erasure-scope.mjs --emit-only > /tmp/airlock-ci-erasure-scope-dossier.json
          node --input-type=module <<'NODE'
          import { openGate } from './packages/contract/dist/index.js';
          import { readFileSync } from 'node:fs';

          const dossier = JSON.parse(readFileSync('.airlock/ci_sqlite_erasure_scope.dossier.json', 'utf8'));
          if (dossier.certificate?.kind !== 'SCOPE' || dossier.certificate.status !== 'PROVEN') {
            throw new Error(`expected PROVEN SCOPE certificate, got ${dossier.certificate?.kind}/${dossier.certificate?.status}`);
          }
          if (!dossier.certificate.scope?.records?.length) {
            throw new Error('expected erasure scope to list records that would be touched');
          }
          if (!dossier.certificate.scope?.exclusions?.length) {
            throw new Error('expected erasure scope to list retention exclusions');
          }
          if (!dossier.target.systems.includes('stripe') || !dossier.target.systems.includes('slack')) {
            throw new Error(`expected cross-system scope, got ${dossier.target.systems.join(',')}`);
          }
          const manifest = JSON.parse(readFileSync('.airlock/ci_sqlite_erasure_scope.scope.json', 'utf8'));
          const detailRows = readFileSync('.airlock/ci_sqlite_erasure_scope.scope.ndjson', 'utf8').trim().split('\n');
          if (detailRows.length !== manifest.artifacts.rows) {
            throw new Error(`expected offloaded detail artifact to contain ${manifest.artifacts.rows} row(s), got ${detailRows.length}`);
          }
          if (!detailRows.some((line) => line.includes('"action":"retain"'))) {
            throw new Error('expected detail artifact to include retained rows as explicit exclusions');
          }

          const gate = openGate(dossier, { email: 'ci-approver@airlock.dev', role: 'approver' });
          if (gate.state !== 'OPEN' || gate.grant?.irreversible !== true || gate.grant?.final !== false) {
            throw new Error(`expected irreversible erasure gate awaiting quorum, got ${JSON.stringify(gate)}`);
          }
          NODE

      - name: Build the MCP server
        run: npm run build --workspace @airlock/mcp

      - name: Test
        run: node --test packages/contract/test/*.test.mjs packages/mcp/test/*.test.mjs

      - name: Fixtures produce the gate verdict they claim
        run: npm run check:fixtures

      - name: No agent can write to production without holding the gate
        run: npm run check:agents

      # The README's banners are animated SVGs committed to the repo, which
      # makes them code. An SVG with one unescaped ampersand does not degrade —
      # it renders as a broken image, on the first thing a judge looks at.
      - name: The README's assets parse and reference each other correctly
        run: npm run check:assets

      # airlock.policy.yaml is authored, not generated — a team is meant to edit
      # it. This asserts it still resolves to exactly the shipped default, so the
      # console enforcing one thing while the docs and tests describe another
      # fails the build rather than surviving until someone notices. It also
      # asserts the rules that must never exist: no change freeze on erasure,
      # money or access, and self-approval not configurable to on.
      - name: The policy file and the shipped default agree
        run: npm run check:policy

      # The README's claims table names a file and a line for every load-bearing
      # claim, and this resolves each anchor against the code. A claim that no
      # longer points at anything is a failure here rather than a discovery a
      # judge makes with a broken link, which is the whole reason it exists.
      # Rule R1. A seeded row that can reach a certificate turns every number on
      # the card into a claim about a database that does not exist, and it will
      # still look exactly right. The boundary is enforced rather than trusted.
      - name: No simulated data can reach the certificate path
        run: npm run check:simulation

      - name: Every claim in the README still points at the code
        run: npm run verify:claims

      - name: Typecheck every workspace
        run: npm run typecheck

      - name: Build the console
        run: npm run build --workspace @airlock/console

      # Generated files are emitted from the source of truth. If regenerating
      # them changes anything, the docs and the code have drifted.
      #
      # The diff is scoped to exactly the paths the generators write, and mode
      # changes are ignored. An earlier version diffed the whole tree, which
      # meant `npm ci` chmod-ing a declared `bin` to 755 on Linux was reported
      # as "generated files are stale" — an error that sends the reader to the
      # wrong file entirely. A check whose failure message is misleading is
      # worse than no check.
      - name: Generated artefacts are up to date
        run: |
          npm run gen:schema
          npm run gen:capabilities
          npm run gen:policy
          npm run gen:examples
          if ! git -c core.fileMode=false diff --quiet --exit-code --                  contracts/dossier.schema.json                  'contracts/examples/*.json'                  docs/CAPABILITIES.md                  docs/POLICY.md; then
            echo "::error::Generated files are stale. Run 'npm run gen' and commit the result."
            git -c core.fileMode=false --no-pager diff --stat --                  contracts/dossier.schema.json                  'contracts/examples/*.json'                  docs/CAPABILITIES.md                  docs/POLICY.md
            exit 1
          fi

      # Anything else the build dirtied is worth knowing about, but it is not a
      # drift in the docs and must not be reported as one.
      - name: Report any other working-tree change
        if: always()
        run: |
          if ! git -c core.fileMode=false diff --quiet --exit-code; then
            echo "::warning::The build left unrelated changes in the working tree:"
            git -c core.fileMode=false --no-pager diff --stat
          fi
