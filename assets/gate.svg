<svg xmlns="http://www.w3.org/2000/svg" width="880" height="330" viewBox="0 0 880 330" role="img">
<title>AIRLOCK approval gate: the Approve button is never rendered until a change is proven</title>
<desc>Three states cycle in one card. Sealed with no certificate, sealed because rollback did not restore, and proven. Only in the proven state does an Approve button exist at all.</desc>
<style><![CDATA[
.s1,.s12{opacity:1}
.s2,.s3,.btn{opacity:0}
.rA{fill:#f7942f}
.rB,.rC{fill:#868c96}
.edge{fill:#ff5257}
.sel{opacity:1}
.s1{animation:s1 9s linear infinite both}
.s2{animation:s2 9s linear infinite both}
.s3{animation:s3 9s linear infinite both}
.s12{animation:s12 9s linear infinite both}
.edge{animation:edge 9s linear infinite both}
.rA{animation:rowA 9s linear infinite both}
.rB{animation:rowB 9s linear infinite both}
.rC{animation:rowC 9s linear infinite both}
.sel{animation:sel 9s linear infinite both}
.btn{animation:btnIn 9s ease-out infinite both}
@keyframes s1{0%,30%{opacity:1}33.33%,96.67%{opacity:0}100%{opacity:1}}
@keyframes s2{0%,30%{opacity:0}33.33%,63.33%{opacity:1}66.67%,100%{opacity:0}}
@keyframes s3{0%,63.33%{opacity:0}66.67%,96.67%{opacity:1}100%{opacity:0}}
@keyframes s12{0%,63.33%{opacity:1}66.67%,96.67%{opacity:0}100%{opacity:1}}
@keyframes edge{0%,63.33%{fill:#ff5257}66.67%,96.67%{fill:#35d6a4}100%{fill:#ff5257}}
@keyframes rowA{0%,30%{fill:#f7942f}33.33%,96.67%{fill:#868c96}100%{fill:#f7942f}}
@keyframes rowB{0%,30%{fill:#868c96}33.33%,63.33%{fill:#f7942f}66.67%,100%{fill:#868c96}}
@keyframes rowC{0%,63.33%{fill:#868c96}66.67%,96.67%{fill:#f7942f}100%{fill:#868c96}}
@keyframes sel{
0%,30%{transform:translateY(0);opacity:1}
33.33%,63.33%{transform:translateY(34px);opacity:1}
66.67%,96.67%{transform:translateY(68px);opacity:1}
98.2%{transform:translateY(68px);opacity:0}
98.3%{transform:translateY(0);opacity:0}
100%{transform:translateY(0);opacity:1}}
@keyframes btnIn{
0%,66.67%{opacity:0;transform:translate(350px,208px) scale(.9) translate(-350px,-208px)}
71%{opacity:1;transform:translate(350px,208px) scale(1.03) translate(-350px,-208px)}
74%,96.67%{opacity:1;transform:translate(350px,208px) scale(1) translate(-350px,-208px)}
100%{opacity:0;transform:translate(350px,208px) scale(.9) translate(-350px,-208px)}}
@media (prefers-reduced-motion: reduce) {
  .s1, .s12, .sel { opacity: 1 }
  .s2, .s3, .btn { opacity: 0 }
  .rA { fill: #f7942f }
  .rB, .rC { fill: #868c96 }
  .edge { fill: #ff5257 }
}
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; }
}
]]></style>

<rect x="0" y="0" width="880" height="330" fill="#0b0d11"/>
<rect x="16.5" y="16.5" width="847" height="297" fill="none" stroke="#1f2530" shape-rendering="crispEdges"/>

<text x="36" y="42" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="0.16em" fill="#f0efec">AIRLOCK<tspan fill="#868c96"> &#183; APPROVAL GATE</tspan></text>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="0.1em" fill="#868c96" text-anchor="end">
  <text class="s1" x="844" y="42">STATE <tspan fill="#f7942f">01</tspan> / 03</text>
  <text class="s2" x="844" y="42">STATE <tspan fill="#f7942f">02</tspan> / 03</text>
  <text class="s3" x="844" y="42">STATE <tspan fill="#f7942f">03</tspan> / 03</text>
</g>
<line x1="16" y1="58.5" x2="864" y2="58.5" stroke="#1f2530" shape-rendering="crispEdges"/>

<text x="32" y="94" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="0.16em" fill="#868c96">GATE STATE</text>
<line x1="32" y1="100.5" x2="246" y2="100.5" stroke="#1f2530" shape-rendering="crispEdges"/>
<line x1="33.5" y1="110" x2="33.5" y2="196" stroke="#1f2530" shape-rendering="crispEdges"/>
<rect class="sel" x="32" y="110" width="3" height="16" fill="#f7942f"/>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" letter-spacing="0.08em">
  <text class="rA" x="48" y="122">01 &#183; NO CERTIFICATE</text>
  <text class="rB" x="48" y="156">02 &#183; CERTIFICATE FAILED</text>
  <text class="rC" x="48" y="190">03 &#183; PROVEN</text>
</g>

<text x="648" y="94" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="0.16em" fill="#868c96">PERMISSION TYPE</text>
<line x1="648" y1="100.5" x2="844" y2="100.5" stroke="#1f2530" shape-rendering="crispEdges"/>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#868c96">
  <text x="648" y="124">type <tspan fill="#f0efec">ApprovalGrant</tspan> = {</text>
  <text x="660" y="142">readonly [witness]: true</text>
  <text x="648" y="160">}</text>
  <text x="648" y="188"><tspan fill="#4fc3f7">openGate</tspan>(p): <tspan fill="#f0efec">ApprovalGrant</tspan></text>
  <text x="648" y="214">// no other constructor</text>
</g>

<rect x="260.5" y="78.5" width="359" height="183" fill="#12151b" stroke="#1f2530" shape-rendering="crispEdges"/>
<rect class="edge" x="261" y="79" width="3" height="182"/>
<text x="284" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#f0efec">Drop column plan_name</text>
<text x="284" y="122" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#868c96">migration &#183; payments.subscriptions</text>
<line x1="264" y1="136.5" x2="619" y2="136.5" stroke="#1f2530" shape-rendering="crispEdges"/>

<g class="s1">
  <rect x="284.5" y="148.5" width="209" height="21" fill="none" stroke="#ff5257" shape-rendering="crispEdges"/>
  <rect x="294" y="155.5" width="6" height="6" fill="#ff5257"/>
  <text x="308" y="163" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="0.06em" fill="#ff5257">SEALED &#8212; NO CERTIFICATE</text>
</g>
<g class="s2">
  <rect x="284.5" y="148.5" width="283" height="21" fill="none" stroke="#ff5257" shape-rendering="crispEdges"/>
  <rect x="294" y="155.5" width="6" height="6" fill="#ff5257"/>
  <text x="308" y="163" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="0.06em" fill="#ff5257">SEALED &#8212; ROLLBACK DID NOT RESTORE</text>
</g>
<g class="s3">
  <rect x="284.5" y="148.5" width="86" height="21" fill="none" stroke="#35d6a4" shape-rendering="crispEdges"/>
  <rect x="294" y="155.5" width="6" height="6" fill="#35d6a4"/>
  <text x="308" y="163" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="0.06em" fill="#35d6a4">PROVEN</text>
  <g class="btn">
    <rect x="284" y="190" width="132" height="36" fill="#d2691e"/>
    <text x="350" y="212.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" letter-spacing="0.04em" fill="#14161a">Approve</text>
  </g>
  <text x="284" y="248" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#868c96">ApprovalGrant built from witness <tspan fill="#35d6a4">ck:9f2ca41d</tspan></text>
</g>
<g class="s12">
  <rect x="284.5" y="190.5" width="131" height="35" fill="none" stroke="#868c96" stroke-dasharray="5 4" opacity="0.5"/>
  <text x="284" y="248" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#868c96">no ApprovalGrant can be constructed</text>
</g>

<line x1="16" y1="276.5" x2="864" y2="276.5" stroke="#1f2530" shape-rendering="crispEdges"/>
<text x="440" y="296" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#868c96">openGate() is the only constructor. The witness is a module-private symbol.</text>
</svg>
