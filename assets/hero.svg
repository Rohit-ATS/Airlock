<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="280" viewBox="0 0 880 280" role="img">
  <title>AIRLOCK — a change is rehearsed on a shadow copy: pre, post, and post-rollback checksums, where post-rollback matches pre.</title>
  <desc>Dark banner. The AIRLOCK wordmark sits left. On the right, three monospaced checksum rows appear in sequence: pre, post, and post-rollback. The post-rollback checksum equals the pre checksum, a bracket links them and a MATCH chip confirms the change is provably reversible.</desc>

  <style>
    /* ---- resting state = the final, readable state (animation off) ---- */
    .row   { opacity: 1; }
    .brk   { stroke-dashoffset: 0; opacity: 1; }
    .chip  { opacity: 1; }
    .foot  { opacity: 1; }
    .eq    { fill: #35d6a4; }
    .neq   { fill: #868c96; }
    .dot   { opacity: 1; }

    /* ---- 9s cycle, all in phase, no per-element delays ---- */
    .r1   { animation: r1   9s ease-out infinite both; }
    .r2   { animation: r2   9s ease-out infinite both; }
    .r3   { animation: r3   9s ease-out infinite both; }
    .brk  { animation: brk  9s ease-in-out infinite both; }
    .chip { animation: chip 9s ease-out infinite both; }
    .foot { animation: foot 9s ease-out infinite both; }
    .eq   { animation: eq   9s linear infinite both; }
    .neq  { animation: neq  9s linear infinite both; }
    .dot  { animation: dot  9s ease-in-out infinite both; }

    @keyframes r1 {
      0%, 2%     { opacity: 0; transform: translateX(-12px); }
      9%, 83%    { opacity: 1; transform: translateX(0); }
      92%, 100%  { opacity: 0; transform: translateX(0); }
    }
    @keyframes r2 {
      0%, 10%    { opacity: 0; transform: translateX(-12px); }
      17%, 83%   { opacity: 1; transform: translateX(0); }
      92%, 100%  { opacity: 0; transform: translateX(0); }
    }
    @keyframes r3 {
      0%, 18%    { opacity: 0; transform: translateX(-12px); }
      25%, 83%   { opacity: 1; transform: translateX(0); }
      92%, 100%  { opacity: 0; transform: translateX(0); }
    }
    @keyframes brk {
      0%, 27%    { stroke-dashoffset: 84; opacity: 1; }
      37%, 83%   { stroke-dashoffset: 0;  opacity: 1; }
      92%, 100%  { stroke-dashoffset: 0;  opacity: 0; }
    }
    @keyframes chip {
      0%, 37%    { opacity: 0; transform: translateX(-8px); }
      44%, 83%   { opacity: 1; transform: translateX(0); }
      92%, 100%  { opacity: 0; transform: translateX(0); }
    }
    @keyframes foot {
      0%, 44%    { opacity: 0; }
      50%, 83%   { opacity: 1; }
      92%, 100%  { opacity: 0; }
    }
    @keyframes eq {
      0%, 36%    { fill: #f0efec; }
      44%, 92%   { fill: #35d6a4; }
      93%, 100%  { fill: #f0efec; }
    }
    @keyframes neq {
      0%, 36%    { fill: #f0efec; }
      44%, 92%   { fill: #868c96; }
      93%, 100%  { fill: #f0efec; }
    }
    @keyframes dot {
      0%   { opacity: 1; }
      50%  { opacity: 0.35; }
      100% { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <!-- ground -->
  <rect x="0" y="0" width="880" height="280" fill="#0b0d11"/>
  <rect x="1.5" y="1.5" width="877" height="277" fill="none" stroke="#1f2530" stroke-width="1"/>

  <!-- ============ left: wordmark ============ -->
  <rect class="dot" x="48" y="63" width="7" height="7" fill="#d2691e"/>
  <text x="64" y="70" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="2" fill="#d2691e">CHANGE-CONTROL CONSOLE</text>

  <text x="48" y="132" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="54" font-weight="700" letter-spacing="6" fill="#f0efec">AIRLOCK</text>

  <text font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#868c96">
    <tspan x="48" y="162">certificate.status !== "PROVEN"</tspan>
    <tspan x="48" y="182">→  the approval gate is never offered.</tspan>
  </text>

  <line x1="48" y1="206.5" x2="404" y2="206.5" stroke="#1f2530" stroke-width="1"/>
  <text x="48" y="232" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#868c96">23 harness capabilities · 7 change classes · 245 tests</text>

  <!-- ============ right: proof sequence ============ -->
  <rect x="448.5" y="44.5" width="383" height="191" fill="#12151b" stroke="#1f2530" stroke-width="1"/>
  <text x="470" y="70" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.5" fill="#868c96">SHADOW REHEARSAL</text>
  <text x="812" y="70" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#868c96">sha-256</text>
  <line x1="448.5" y1="84.5" x2="831.5" y2="84.5" stroke="#1f2530" stroke-width="1"/>
  <line x1="592.5" y1="100" x2="592.5" y2="200" stroke="#1f2530" stroke-width="1"/>

  <!-- bracket: row 1 tied to row 3 -->
  <path class="brk" d="M 478 118 L 470 118 L 470 186 L 478 186" fill="none" stroke="#35d6a4" stroke-width="1.25" stroke-dasharray="84"/>

  <!-- row 1 : pre -->
  <g class="row r1">
    <text x="488" y="122" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#868c96">pre</text>
    <text class="eq" x="604" y="122" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">sha256:0234ab62…6a34</text>
  </g>

  <!-- row 2 : post -->
  <g class="row r2">
    <text x="488" y="156" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#868c96">post</text>
    <text class="neq" x="604" y="156" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">sha256:9f11c7de…22b1</text>
  </g>

  <!-- row 3 : post-rollback -->
  <g class="row r3">
    <text x="488" y="190" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#868c96">post-rollback</text>
    <text class="eq" x="604" y="190" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">sha256:0234ab62…6a34</text>
  </g>

  <!-- MATCH chip -->
  <g class="chip">
    <rect x="760.5" y="178.5" width="57" height="16" fill="#12151b" stroke="#35d6a4" stroke-width="1"/>
    <text x="789" y="190" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1" fill="#35d6a4">MATCH</text>
  </g>

  <!-- verdict -->
  <text class="foot" x="488" y="216" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">
    <tspan fill="#35d6a4">post-rollback == pre</tspan><tspan fill="#868c96"> · provably reversible</tspan>
  </text>
</svg>
